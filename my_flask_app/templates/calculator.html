<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Калькулятор</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); text-align: center; }
        input[type="number"] { padding: 10px; margin: 5px; width: 80px; text-align: center; }
        select { padding: 10px; margin: 5px; }
        button { padding: 10px 20px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #218838; }
        .result { margin-top: 20px; font-size: 1.2em; font-weight: bold; color: #333; }
        .error { color: red; margin-top: 10px; }
        .back-link { display: block; margin-top: 20px; text-decoration: none; color: #007bff; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Простой Калькулятор</h2>
        
        <form method="POST">
            <input type="number" step="any" name="num1" placeholder="Число 1" required>
            
            <select name="operation">
                <option value="+">+</option>
                <option value="-">-</option>
                <option value="*">*</option>
                <option value="/">/</option>
            </select>
            
            <input type="number" step="any" name="num2" placeholder="Число 2" required>
            
            <br>
            <button type="submit">Вычислить</button>
        </form>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        {% if result is not none %}
            <div class="result">Результат: {{ result }}</div>
        {% endif %}

        <a href="/" class="back-link">← На главную</a>
    </div>
</body>
</html>
